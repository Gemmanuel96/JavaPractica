<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
    <h1>Enlaces</h1>

    <!-- Para no ocacionar un error de enlace, hay que poner https:// -->
    <a href="https://youtube.com">Youtube</a>
    <br>
    <!-- Navegar entre mis html -->
    <a href="1_2Parrafos.HTML">Parrafos</a>

    <!-- Imagenes-->
    <br>
    <p>Imagen: img</p>
    <!-- src: ./imagenJpg -->
    <!-- alt: descrip. por si no carga la imagen -->
    <!-- Para navegar entre las carpetas anteriores '../ ' -->
    <img src="../png-clipart-desktop-dpi-300-computer-monochrome-thumbnail.png" width="100" alt="Imgen de intenet" title="Imagen de internet">
    <br>
    <!-- Imagen formato SVG -->
    <p>Imagen SVG</p>
    <img src="../undraw_around-the-world_1p8h.svg" alt="" width="300" height="200">
    <br>
    <!-- Ingresamos a otra carpeta -->
    <img src="../valentin-beauvais-yVUQlyRlJSw-unsplash(1).jpg" alt="">
    
    
    <!-- Iframe -->
    <br>
    <p>Este es un video en Iframe</p>
    <iframe width="300" height="200" src="https://www.youtube.com/embed/aFpns1de-Hk" title="CURSO HTML &amp; CSS desde CERO [COMPLETO]." frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <!-- Nos permite agregar un audio o video con los controles -->
    <audio src="" controls></audio>
    <video src="" control></video>


</body>
</html>
