<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas y listas</title>
</head>
<body>

    <ol>
        <li>Algo</li>
        <li>Cosa</li>
        <li>objeto</li>
    </ol>

    <ul>
        <li>Gonzalo</li>
        <li>JUliama</li>
        <li>cosas extrañas</li>
    </ul>
    

    <!-- Tablas / border = valor :Aplica un borde -->
    <table border="3"> 
        
        <!--caption: le damos el nombre de la tabla  -->
        <caption>resgistro de personas</caption>

        <tr> <!-- tr: Fila-->
            <!-- th: nombre de columnas -->
            <th>Nombre</th> 
            <th>Apellido</th>
            <th>DNI</th>

        </tr>
        
        <tr><!-- tr: Fila-->
            <!--td: Valores de columna-->
            <td>Gonzalo</td> 
            <td>Nuñez</td>
            <td>1516518641</td>

        </tr>

    </table>


</body>
</html>
