    <title>Etiquetas de contenido</title>
</head>

<!-- Cuerpo de mi pagina web -->
<body>
    <!-- Encabezado del Sitio o de una Seccion-->
    <header class="cabezal">
        <h2>Menu de navegacion de la pagina</h2>
    </header>

    <!-- Contenedor de los enlaces de navegacion del sitio -->
    <nav class="navegacion">

    </nav>

    <!-- Define el contenido central y unico de la pagina  -->
    <main>

        <h2>COntenido principal de  la pagina</h2>

    </main>

    <!-- Agrupa contenido relacionado tematicamente -->
    <section class="seccion">

        <h2>Galeria de imagenes</h2>
    </section>

  

    <!-- COntenido lateral o tangencial(barras laterales) -->
    <aside>
        <!-- COntenido independiente y distribuuible(como un post de blog) -->
        <article class="articulo">

        </article>

    </aside>


    <!-- Pie de la pagina con creditos, contactos o avisos legales -->
    <footer>

    </footer>

    <!-- Estiquetas de cajas -->
    <div>
    </div>
